<!DOCTYPE html>
<html lang="lv">
<head>
    <meta charset="UTF-8">
    <title>Solar Cargo System</title>
	<link rel="stylesheet" href="style.css">
</head>

<body>
<div class="container">
	<header>
		<h1>🚀 Solar Cargo System</h1>
	</header>

	<nav>
		<a href="index.html">Sākums</a>
		<a href="containers.html">Konteineri</a>
	</nav>
	
	<main class="izkartojums">
		<section class="sadala">
			<h2>Konteineru saraksts</h2>
			<table>
			<table>
				<thead>
					<tr>
						<th>ID</th>
						<th>Minerāls</th>
						<th>Izcelsmes bāze</th>
						<th>Galamērķa Bāze</th>
						<th>Statuss</th>
					</tr>
				</thead>
				<tbody>
					<tr>
						<td>SC-1023</td>
						<td>Titānīts</td>
						<td>Titāns</td>
						<td>Mēness</td>
						<td>Ceļā</td>
					</tr>
				</tbody>
				<tbody>
					<tr>
						<td>DC-1023</td>
						<td>Litijs</td>
						<td>Zeme</td>
						<td>Marss</td>
						<td>Noliktavā</td>
					</tr>
				</tbody>
  			</table>
		</section>

		<section class="sadala">
			<h2>Pievienot konteineru</h2>
			<form>
				<label for="lID">ID:</label><br>
				<input type="text" id="lID" name="lID" value="ZZ-9987"><br>
			  
				<label for="lmineral">Minerāls:</label><br>
				<input type="text" id="lmineral" name="lmineral" value="Broms"><br>
			  
				<label for="lorigin_base">Izcelšanās bāze:</label><br>
				<input type="text" id="lorigin_base" name="lorigin_base" value="Mēness 2"><br>
			  
				<label for="ldestination">Galamērķa bāze:</label><br>
				<input type="text" id="ldestination" name="ldestination" value="Zeme_Latvija_1"><br>
			  
				<label for="lstatus">Statuss:</label><br>
				<select id="lstatus" name="lstatus">
					<option value="none">---</option>
					<option value="on_way">Ceļā</option>
					<option value="at_wearhouse">Noliktavā</option>
					<option value="delivered">Piegādāts</option>
				</select>
  
				<input type="submit" value="Saglabāt">
			</form>
		</section>
	</main>

	<footer>
		<p>&copy; 2025 Solar Cargo</p>
	</footer>
	
</div>
</body>
</html>
